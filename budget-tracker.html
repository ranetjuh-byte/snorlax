<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Budget • Vrij te besteden</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0E14;
  --surface:#141924;
  --surface2:#1C2330;
  --surface3:#242D3D;
  --line:#242C3A;
  --text:#F2F4F7;
  --text-dim:#8891A6;
  --text-faint:#5B6478;
  --mint:#3FE0B0;
  --mint-dim:#1E5B49;
  --coral:#FF6B6B;
  --coral-dim:#5A2A2E;
  --amber:#FFB65C;
  --blue:#5CA8FF;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}

.num{
  font-family:'Space Grotesk',sans-serif;
  font-feature-settings:"tnum";
  font-variant-numeric:tabular-nums;
}

#app{
  width:100%;
  max-width:440px;
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(120% 60% at 50% -10%,#16324A22 0%,transparent 60%),
    var(--bg);
  padding-bottom:100px;
}

header.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 12px;
  background:linear-gradient(180deg,var(--bg) 80%,transparent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text-faint);
  font-weight:600;
}

.cycle-label{
  font-size:13px;
  color:var(--text-dim);
  margin-top:2px;
}

.month-total{
  text-align:right;
  font-size:11px;
  color:var(--text-faint);
}

.month-total .amt{
  font-size:15px;
  color:var(--mint);
  font-weight:600;
  display:block;
}

main{
  padding:4px 20px 20px;
}

section.tab{
  display:none;
  animation:fadein .25s ease;
}

section.tab.active{
  display:block;
}

@keyframes fadein{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   VANDAAG
========================= */

.hero{
  background:linear-gradient(160deg,var(--surface2),var(--surface));
  border:1px solid var(--line);
  border-radius:28px;
  padding:22px 18px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:8px;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(60% 50% at 50% 0%,rgba(63,224,176,.10),transparent 70%);
  pointer-events:none;
}

.ring-wrap{
  position:relative;
  width:185px;
  height:185px;
}

.ring-wrap svg{
  transform:rotate(-90deg);
}

.ring-center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.ring-center .label{
  font-size:10px;
  color:var(--text-faint);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:5px;
}

.ring-center .amt{
  font-size:34px;
  font-weight:700;
  line-height:1;
}

.ring-center .sub{
  font-size:11px;
  color:var(--text-dim);
  margin-top:7px;
}

.week-highlight{
  width:100%;
  background:var(--surface3);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  margin-top:12px;
}

.week-highlight-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.week-highlight-label{
  font-size:10px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.07em;
}

.week-highlight-value{
  font-size:22px;
  font-weight:700;
  margin-top:3px;
}

.week-highlight-sub{
  font-size:11px;
  color:var(--text-dim);
  margin-top:2px;
}

.week-progress{
  margin-top:10px;
}

.daily-budget-small{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
  padding:0 3px;
}

.daily-budget-small .label{
  font-size:11px;
  color:var(--text-faint);
}

.daily-budget-small .value{
  font-size:14px;
  font-weight:600;
  color:var(--text-dim);
}

.hero-stats{
  display:flex;
  gap:10px;
  width:100%;
  margin-top:12px;
}

.stat-chip{
  flex:1;
  background:var(--surface3);
  border-radius:16px;
  padding:11px 13px;
  border:1px solid var(--line);
}

.stat-chip .t{
  font-size:10px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.stat-chip .v{
  font-size:16px;
  font-weight:600;
  margin-top:4px;
}

.stat-chip .v.pos{
  color:var(--mint);
}

.stat-chip .v.neg{
  color:var(--coral);
}

.bar-track{
  height:5px;
  background:var(--surface);
  border-radius:4px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:4px;
  transition:width .4s ease;
}

.section-title{
  font-size:13px;
  font-weight:600;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin:26px 2px 10px;
}

/* =========================
   UITGAVEN
========================= */

.tx-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
  margin-bottom:8px;
}

.tx-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.tx-body{
  flex:1;
  min-width:0;
}

.tx-cat{
  font-size:13.5px;
  font-weight:600;
}

.tx-meta{
  font-size:11.5px;
  color:var(--text-faint);
  margin-top:1px;
}

.tx-amt{
  font-size:15px;
  font-weight:600;
}

.tx-del{
  background:none;
  border:none;
  color:var(--text-faint);
  font-size:18px;
  padding:4px 2px;
  cursor:pointer;
  line-height:1;
}

.empty{
  text-align:center;
  color:var(--text-faint);
  font-size:13px;
  padding:26px 10px;
  background:var(--surface);
  border:1px dashed var(--line);
  border-radius:16px;
}

/* =========================
   WEKEN
========================= */

.week-flow{
  display:flex;
  flex-direction:column;
}

.week-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px 16px 14px;
  margin-bottom:2px;
}

.week-card.current{
  border-color:#2E5A4C;
  box-shadow:0 0 0 1px #2E5A4C inset;
}

.week-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.week-name{
  font-size:14.5px;
  font-weight:600;
}

.week-period{
  font-size:11.5px;
  color:var(--text-faint);
  margin-top:2px;
}

.week-remaining{
  text-align:right;
}

.week-remaining .v{
  font-size:19px;
  font-weight:700;
}

.week-remaining .l{
  font-size:10px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.week-detail{
  display:flex;
  gap:16px;
  margin-top:12px;
  font-size:11.5px;
  color:var(--text-dim);
}

.week-detail b{
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
}

.flow-connector{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 4px 6px 30px;
  margin-left:2px;
}

.flow-line{
  width:1px;
  height:18px;
  background:var(--line);
}

.flow-badge{
  font-size:11px;
  font-weight:600;
  padding:2px 9px;
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:4px;
}

.flow-badge.pos{
  background:var(--mint-dim);
  color:var(--mint);
}

.flow-badge.neg{
  background:var(--coral-dim);
  color:var(--coral);
}

.expand-list{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.chev{
  transition:transform .2s ease;
  color:var(--text-faint);
}

.chev.open{
  transform:rotate(180deg);
}

/* =========================
   CATEGORIEËN
========================= */

.cat-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  margin-bottom:10px;
}

.cat-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:8px;
}

.cat-name{
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}

.cat-dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.cat-nums{
  font-size:12.5px;
  color:var(--text-dim);
}

.cat-nums b{
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
}

/* =========================
   GESCHIEDENIS
========================= */

.history-summary{
  background:linear-gradient(160deg,var(--surface2),var(--surface));
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-top:8px;
}

.history-summary-title{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.07em;
}

.history-summary-total{
  font-size:30px;
  font-weight:700;
  margin-top:4px;
}

.history-summary-sub{
  font-size:12px;
  color:var(--text-dim);
  margin-top:4px;
}

.history-rank{
  display:flex;
  align-items:center;
  gap:11px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  margin-bottom:8px;
}

.rank-number{
  width:26px;
  height:26px;
  border-radius:9px;
  background:var(--surface3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  color:var(--text-dim);
  flex:none;
}

.rank-info{
  flex:1;
  min-width:0;
}

.rank-name{
  font-size:13.5px;
  font-weight:600;
}

.rank-bar{
  margin-top:7px;
  height:5px;
  background:var(--surface3);
  border-radius:5px;
  overflow:hidden;
}

.rank-amount{
  text-align:right;
  font-size:14px;
  font-weight:700;
}

.rank-percent{
  font-size:10.5px;
  color:var(--text-faint);
  margin-top:2px;
  text-align:right;
}

.history-filter{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.history-filter button{
  flex:1;
  background:var(--surface3);
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:12px;
  padding:9px 8px;
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
}

.history-filter button.active{
  background:var(--mint);
  color:#04241B;
  border-color:var(--mint);
}

/* =========================
   SPAARDOELEN
========================= */

.savings-total{
  background:
    linear-gradient(
      145deg,
      rgba(63,224,176,.13),
      var(--surface)
    );

  border:1px solid #285B4D;
  border-radius:24px;
  padding:20px;
  margin-top:8px;
}

.savings-total-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.07em;
}

.savings-total-value{
  font-size:32px;
  font-weight:700;
  color:var(--mint);
  margin-top:4px;
}

.savings-total-sub{
  font-size:12px;
  color:var(--text-dim);
  margin-top:4px;
}

.savings-goal-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:10px;
}

.savings-goal-top{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.savings-goal-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--surface3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex:none;
}

.savings-goal-info{
  flex:1;
  min-width:0;
}

.savings-goal-name{
  font-size:15px;
  font-weight:700;
}

.savings-goal-target{
  font-size:11px;
  color:var(--text-faint);
  margin-top:3px;
}

.savings-goal-saved{
  text-align:right;
}

.savings-goal-saved .value{
  font-size:16px;
  font-weight:700;
  color:var(--mint);
}

.savings-goal-saved .label{
  font-size:9px;
  color:var(--text-faint);
  text-transform:uppercase;
}

.savings-goal-progress{
  height:7px;
  background:var(--surface3);
  border-radius:8px;
  overflow:hidden;
  margin-top:14px;
}

.savings-goal-progress-fill{
  height:100%;
  background:var(--mint);
  border-radius:8px;
}

.savings-goal-numbers{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:10.5px;
  color:var(--text-faint);
}

.savings-goal-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.small-action{
  flex:1;
  border:1px solid var(--line);
  background:var(--surface3);
  color:var(--text-dim);
  border-radius:11px;
  padding:9px 5px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.small-action.primary{
  background:var(--mint);
  color:#04241B;
  border-color:var(--mint);
}

.small-action.danger{
  color:var(--coral);
}

/* =========================
   INSTELLINGEN
========================= */

.field-group{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  margin-bottom:14px;
}

.field-group h3{
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-faint);
  margin:0 0 10px;
}

.field-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}

.field-row:last-child{
  border-bottom:none;
}

.field-row label{
  font-size:13.5px;
  color:var(--text);
}

.field-row input{
  background:var(--surface3);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:8px 10px;
  font-size:14px;
  width:120px;
  text-align:right;
  font-family:'Space Grotesk',sans-serif;
}

.field-row input[type="date"]{
  width:150px;
  text-align:left;
  font-family:'Inter',sans-serif;
}

.field-row input:focus{
  outline:2px solid var(--mint);
  outline-offset:0;
}

.pct-warn{
  font-size:11.5px;
  margin-top:6px;
  text-align:right;
}

.pct-warn.ok{
  color:var(--mint);
}

.pct-warn.bad{
  color:var(--coral);
}

/* =========================
   BUTTONS
========================= */

.primary-btn{
  width:100%;
  background:var(--mint);
  color:#04241B;
  border:none;
  border-radius:14px;
  padding:15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.ghost-btn{
  width:100%;
  background:none;
  color:var(--text-faint);
  border:none;
  padding:12px;
  font-size:13.5px;
  margin-top:4px;
  cursor:pointer;
}

.danger-btn{
  width:100%;
  background:var(--coral-dim);
  color:var(--coral);
  border:1px solid #5A2A2E;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

/* =========================
   NAV
========================= */

nav.tabbar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:440px;
  background:rgba(20,25,36,.94);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);
  z-index:50;
}

.tab-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  background:none;
  border:none;
  color:var(--text-faint);
  padding:6px 0;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:9.5px;
  font-weight:600;
}

.tab-btn.active{
  color:var(--mint);
}

.tab-btn svg{
  width:21px;
  height:21px;
}

.fab{
  position:fixed;
  right:20px;
  bottom:78px;
  z-index:55;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(150deg,var(--mint),#26B98C);
  color:#04241B;
  border:none;
  font-size:28px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(63,224,176,.35);
  cursor:pointer;
}

/* =========================
   MODALS
========================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:70;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}

.sheet-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%,100%);
  width:100%;
  max-width:440px;
  background:var(--surface2);
  border-radius:26px 26px 0 0;
  border:1px solid var(--line);
  border-bottom:none;
  padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  z-index:71;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:88vh;
  overflow-y:auto;
}

.sheet-backdrop.show .sheet{
  transform:translate(-50%,0);
}

.sheet-handle{
  width:36px;
  height:4px;
  background:var(--line);
  border-radius:3px;
  margin:0 auto 16px;
}

.sheet h2{
  font-size:17px;
  margin:0 0 16px;
}

.amount-input-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin:10px 0 20px;
}

.amount-input-wrap span{
  font-size:30px;
  color:var(--text-faint);
  font-family:'Space Grotesk',sans-serif;
}

.amount-input-wrap input{
  background:none;
  border:none;
  color:var(--text);
  font-size:44px;
  font-weight:700;
  width:200px;
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
}

.amount-input-wrap input:focus{
  outline:none;
}

.chip-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.chip{
  padding:9px 15px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--surface3);
  color:var(--text-dim);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.chip.active{
  background:var(--mint);
  color:#04241B;
  border-color:var(--mint);
}

.text-input{
  width:100%;
  background:var(--surface3);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  margin-bottom:12px;
  font-family:'Inter',sans-serif;
}

.save-toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--surface3);

<script>
(function(){

/* =====================================================
   DEFAULT DATA
===================================================== */

function defaultCycleStart(){

  const t = new Date();
  t.setHours(0,0,0,0);

  const d = t.getDate();

  const start = new Date(
    t.getFullYear(),
    t.getMonth(),
    25
  );

  if(d < 25){
    start.setMonth(start.getMonth()-1);
  }

  return isoDate(start);
}

function defaultData(){

  return {

    settings:{
      salary1:3500,
      salary2:1300,
      fixed1:1800,
      fixed2:550,
      invest:600,

      /*
        Dit blijft puur een
        budgetberekening.
        Dit is NIET je echte spaargeld.
      */
      savingsGoal:500,

      cycleStart:defaultCycleStart(),
      cycleLength:31
    },

    categories:[
      {
        id:'boodschappen',
        name:'Boodschappen',
        pct:50,
        color:'#3FE0B0',
        emoji:'🛒'
      },
      {
        id:'vervoer',
        name:'Benzine / Vervoer',
        pct:30,
        color:'#5CA8FF',
        emoji:'⛽'
      },
      {
        id:'extra',
        name:'Leuke dingen / Extra',
        pct:20,
        color:'#FFB65C',
        emoji:'✨'
      }
    ],

    expenses:[],

    /*
      ECHTE SPAARDOELEN
    */
    savingsGoals:[
      {
        id:1,
        name:'Auto',
        emoji:'🚗',
        target:5000,
        saved:0
      },
      {
        id:2,
        name:'Vakantie',
        emoji:'✈️',
        target:2500,
        saved:0
      },
      {
        id:3,
        name:'Extra',
        emoji:'💰',
        target:1000,
        saved:0
      }
    ],

    /*
      Geschiedenis van echte
      stortingen per spaardoel.
    */
    savingsTransactions:[]

  };

}

/* =====================================================
   DATUM
===================================================== */

function isoDate(d){
  return d.getFullYear()
    +'-'
    +String(d.getMonth()+1).padStart(2,'0')
    +'-'
    +String(d.getDate()).padStart(2,'0');
}

function parseISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d);
}

function addDays(d,n){
  const r = new Date(d);
  r.setDate(r.getDate()+n);
  return r;
}

function todayDate(){
  const t = new Date();
  t.setHours(0,0,0,0);
  return t;
}

function fmtShort(d){
  return d.toLocaleDateString(
    'nl-NL',
    {
      day:'numeric',
      month:'short'
    }
  );
}

function fmtLong(d){
  return d.toLocaleDateString(
    'nl-NL',
    {
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  );
}

function euro(n){

  const sign = n < 0 ? '-' : '';

  return sign
    +'€'
    +Math.abs(n).toLocaleString(
      'nl-NL',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}

/* =====================================================
   STATE
===================================================== */

let DATA = null;

let ui = {
  tab:'vandaag',
  openWeek:null,
  chosenCat:null,
  historyPeriod:'cycle',
  selectedGoalId:null
};

/* =====================================================
   DATA LADEN
===================================================== */

async function loadData(){

  try{

    const raw =
      localStorage.getItem(
        'budget-tracker-data'
      );

    if(raw){

      const data = JSON.parse(raw);

      const defaults = defaultData();

      if(!data.settings){
        data.settings = defaults.settings;
      }

      if(
        typeof data.settings.savingsGoal !== 'number'
      ){
        data.settings.savingsGoal = 500;
      }

      if(!Array.isArray(data.categories)){
        data.categories = defaults.categories;
      }

      if(!Array.isArray(data.expenses)){
        data.expenses = [];
      }

      /*
        NIEUW MODEL

        Als je de vorige versie al gebruikte,
        proberen we oude savings-data niet kwijt
        te raken.

        Oude savings worden indien aanwezig
        omgezet naar het doel "Extra".
      */

      if(!Array.isArray(data.savingsGoals)){

        data.savingsGoals =
          defaults.savingsGoals;

      }

      if(!Array.isArray(data.savingsTransactions)){

        data.savingsTransactions = [];

      }

      /*
        Oude versie had mogelijk "savings".
      */

      if(
        Array.isArray(data.savings) &&
        data.savings.length > 0 &&
        data.savingsTransactions.length === 0
      ){

        let extraGoal =
          data.savingsGoals.find(
            g => g.name === 'Extra'
          );

        if(!extraGoal){

          extraGoal = {
            id:Date.now(),
            name:'Extra',
            emoji:'💰',
            target:1000,
            saved:0
          };

          data.savingsGoals.push(
            extraGoal
          );

        }

        data.savings.forEach(s=>{

          const amount =
            Number(s.amount || 0);

          if(amount > 0){

            data.savingsTransactions.push({

              id:s.id || Date.now(),

              goalId:extraGoal.id,

              amount:amount,

              date:s.date || isoDate(todayDate()),

              note:s.note || 'Oude spaartransactie'

            });

          }

        });

      }

      /*
        saved per doel opnieuw berekenen
        vanuit de transacties.
      */

      data.savingsGoals.forEach(goal=>{

        goal.saved =
          data.savingsTransactions
            .filter(
              t =>
                Number(t.goalId) ===
                Number(goal.id)
            )
            .reduce(
              (sum,t)=>
                sum +
                Number(t.amount || 0),
              0
            );

      });

      return data;
    }

  }catch(e){

    console.error(
      'Laden mislukt',
      e
    );

  }

  return defaultData();
}

/* =====================================================
   OPSLAAN
===================================================== */

async function saveData(){

  try{

    localStorage.setItem(
      'budget-tracker-data',
      JSON.stringify(DATA)
    );

    showToast('Opgeslagen');

  }catch(e){

    console.error(
      'Opslaan mislukt',
      e
    );

    showToast('Opslaan mislukt');
  }
}

let toastTimer = null;

function showToast(msg){

  const el =
    document.getElementById(
      'saveToast'
    );

  el.textContent = msg;

  el.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove('show');
      },
      1600
    );
}

/* =====================================================
   SPAARDOELEN HELPERS
===================================================== */

function recalculateGoalSaved(){

  DATA.savingsGoals.forEach(goal=>{

    goal.saved =
      DATA.savingsTransactions
        .filter(
          t =>
            Number(t.goalId) ===
            Number(goal.id)
        )
        .reduce(
          (sum,t)=>
            sum +
            Number(t.amount || 0),
          0
        );

  });
}

function totalSaved(){

  return DATA.savingsGoals.reduce(
    (sum,goal)=>
      sum +
      Number(goal.saved || 0),
    0
  );
}

function goalProgress(goal){

  if(!goal.target || goal.target <= 0){
    return 0;
  }

  return Math.min(
    100,
    Math.max(
      0,
      (goal.saved / goal.target) * 100
    )
  );
}

/* =====================================================
   MODEL
===================================================== */

function computeModel(){

  const s = DATA.settings;

  const income =
    Number(s.salary1 || 0)
    +
    Number(s.salary2 || 0);

  /*
    BELANGRIJK:

    Extra spaardoel blijft hier
    onderdeel van de budgetberekening.

    Echte spaardoelen hieronder hebben
    hier GEEN invloed op.
  */

  const fixedTotal =
    Number(s.fixed1 || 0)
    +
    Number(s.fixed2 || 0)
    +
    Number(s.invest || 0)
    +
    Number(s.savingsGoal || 0);

  const freeBudget =
    income - fixedTotal;

  const cycleLength =
    Math.max(
      1,
      Number(s.cycleLength || 31)
    );

  const dayBudgetBase =
    freeBudget / cycleLength;

  const cycleStart =
    parseISO(s.cycleStart);

  const fullWeeks =
    Math.floor(
      cycleLength / 7
    );

  const remainder =
    cycleLength -
    fullWeeks * 7;

  const weekLens = [];

  for(
    let i=0;
    i<fullWeeks;
    i++
  ){
    weekLens.push(7);
  }

  if(remainder > 0){
    weekLens.push(remainder);
  }

  let cursor = cycleStart;

  const weeks =
    weekLens.map(
      (len,i)=>{

        const start = cursor;

        const end =
          addDays(
            start,
            len-1
          );

        cursor =
          addDays(
            end,
            1
          );

        const base =
          dayBudgetBase * len;

        return {
          index:i,
          start,
          end,
          days:len,
          base,
          dayBudgetBase:
            base / len
        };
      }
    );

  const today =
    todayDate();

  weeks.forEach(w=>{

    w.expenses =
      DATA.expenses
        .filter(e=>{

          const d =
            parseISO(e.date);

          return (
            d >= w.start &&
            d <= w.end
          );

        })
        .sort(
          (a,b)=>
            b.date.localeCompare(a.date)
        );

    w.spent =
      w.expenses.reduce(
        (sum,e)=>
          sum +
          Number(e.amount || 0),
        0
      );

  });

  let rollIn = 0;

  weeks.forEach(w=>{

    w.rolloverIn = rollIn;

    w.available =
      w.base + rollIn;

    w.remaining =
      w.available - w.spent;

    rollIn =
      w.remaining;

    w.rolloverOut =
      w.remaining;

  });

  let currentWeekIdx =
    weeks.findIndex(
      w =>
        today >= w.start &&
        today <= w.end
    );

  if(currentWeekIdx === -1){

    currentWeekIdx =
      today < weeks[0].start
        ? 0
        : weeks.length - 1;

  }

  const cw =
    weeks[currentWeekIdx];

  const spentBeforeToday =
    cw.expenses
      .filter(
        e =>
          parseISO(e.date) < today
      )
      .reduce(
        (sum,e)=>
          sum +
          Number(e.amount || 0),
        0
      );

  const spentToday =
    cw.expenses
      .filter(
        e =>
          parseISO(e.date).getTime()
          ===
          today.getTime()
      )
      .reduce(
        (sum,e)=>
          sum +
          Number(e.amount || 0),
        0
      );

  const remainingWeekBeforeToday =
    cw.available -
    spentBeforeToday;

  let daysLeftIncl =
    Math.round(
      (cw.end - today) /
      86400000
    ) + 1;

  if(daysLeftIncl < 1){
    daysLeftIncl = 1;
  }

  const dayBudgetToday =
    remainingWeekBeforeToday /
    daysLeftIncl;

  const remainingToday =
    dayBudgetToday -
    spentToday;

  const catStats =
    DATA.categories.map(c=>{

      const budget =
        cw.base *
        (
          Number(c.pct) / 100
        );

      const spent =
        cw.expenses
          .filter(
            e =>
              e.catId === c.id
          )
          .reduce(
            (sum,e)=>
              sum +
              Number(e.amount || 0),
            0
          );

      return {
        ...c,
        budget,
        spent,
        remaining:
          budget - spent
      };

    });

  return {
    income,
    fixedTotal,
    freeBudget,
    dayBudgetBase,
    cycleStart,
    cycleLength,
    weeks,
    currentWeekIdx,
    cw,
    spentToday,
    dayBudgetToday,
    remainingToday,
    remainingWeekBeforeToday,
    catStats,
    today,
    cycleEnd:
      weeks[weeks.length-1].end
  };
}

/* =====================================================
   HELPERS
===================================================== */

function pctClamped(
  spent,
  total
){

  if(total <= 0){
    return spent > 0 ? 100 : 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      (spent / total) * 100
    )
  );
}

function ringColor(usedPct){

  if(usedPct > 100){
    return 'var(--coral)';
  }

  if(usedPct > 80){
    return 'var(--amber)';
  }

  return 'var(--mint)';
}

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

/* =====================================================
   RING
===================================================== */

function renderRing(
  remaining,
  total
){

  const usedPct =
    total > 0
      ? Math.max(
          0,
          Math.min(
            1,
            (total - remaining) /
            total
          )
        )
      : 0;

  const r = 77;

  const c =
    2 * Math.PI * r;

  const dash =
    c * usedPct;

  const color =
    ringColor(
      usedPct * 100
    );

  return `

    <div class="ring-wrap">

      <svg
        width="185"
        height="185"
        viewBox="0 0 185 185"
      >

        <circle
          cx="92.5"
          cy="92.5"
          r="${r}"
          fill="none"
          stroke="var(--surface3)"
          stroke-width="13"
        />

        <circle
          cx="92.5"
          cy="92.5"
          r="${r}"
          fill="none"
          stroke="${color}"
          stroke-width="13"
          stroke-linecap="round"
          stroke-dasharray="${dash} ${c}"
        />

      </svg>

      <div class="ring-center">

        <div class="label">
          Vandaag over
        </div>

        <div
          class="amt num"
          style="
            color:${
              remaining < 0
                ? 'var(--coral)'
                : 'var(--text)'
            }
          "
        >
          ${euro(remaining)}
        </div>

        <div class="sub">
          vandaag beschikbaar
        </div>

      </div>

    </div>

  `;
}

/* =====================================================
   VANDAAG
===================================================== */

function renderVandaag(m){

  const weekPct =
    pctClamped(
      m.cw.spent,
      m.cw.available
    );

  const recent =
    [...DATA.expenses]
      .sort(
        (a,b)=>
          b.date.localeCompare(a.date)
          ||
          b.id-a.id
      )
      .slice(0,6);

  return `

    <div class="hero">

      ${renderRing(
        m.remainingToday,
        m.dayBudgetToday
      )}

      <div class="week-highlight">

        <div class="week-highlight-top">

          <div>

            <div class="week-highlight-label">
              Deze week over
            </div>

            <div
              class="week-highlight-value num"
              style="
                color:${
                  m.cw.remaining < 0
                    ? 'var(--coral)'
                    : 'var(--mint)'
                }
              "
            >
              ${euro(m.cw.remaining)}
            </div>

            <div class="week-highlight-sub">
              Week ${m.currentWeekIdx+1}
              ·
              ${fmtShort(m.cw.start)}
              –
              ${fmtShort(m.cw.end)}
            </div>

          </div>

          <div
            style="
              font-size:11px;
              color:var(--text-faint);
              text-align:right;
            "
          >
            Uitgegeven
            <br>
            <strong
              class="num"
              style="
                color:var(--text-dim);
                font-size:13px;
              "
            >
              ${euro(m.cw.spent)}
            </strong>
          </div>

        </div>

        <div
          class="week-progress"
        >
          <div class="bar-track">
            <div
              class="bar-fill"
              style="
                width:${weekPct}%;
                background:${ringColor(weekPct)};
              "
            ></div>
          </div>
        </div>

      </div>

      <div class="daily-budget-small">

        <div class="label">
          Richtlijn per dag
        </div>

        <div class="value num">
          ${euro(m.dayBudgetToday)}
        </div>

      </div>

      <div class="hero-stats">

        <div class="stat-chip">

          <div class="t">
            Vandaag uitgegeven
          </div>

          <div
            class="v num"
            style="
              color:${
                m.spentToday > 0
                  ? 'var(--coral)'
                  : 'var(--text)'
              };
            "
          >
            ${euro(m.spentToday)}
          </div>

        </div>

        <div class="stat-chip">

          <div class="t">
            Vorige week
          </div>

          <div
            class="
              v
              ${
                m.cw.rolloverIn < 0
                  ? 'neg'
                  : 'pos'
              }
              num
            "
          >
            ${
              m.cw.rolloverIn >= 0
                ? '+'
                : ''
            }
            ${euro(m.cw.rolloverIn)}
          </div>

        </div>

      </div>

    </div>

    <div class="section-title">
      Laatste uitgaven
    </div>

    ${
      recent.length === 0

        ?

        `
          <div class="empty">
            Nog geen uitgaven gelogd.
            <br>
            Tik op + om te beginnen.
          </div>
        `

        :

        recent.map(e=>{

          const cat =
            DATA.categories.find(
              c=>c.id === e.catId
            );

          return `

            <div class="tx-item">

              <div
                class="tx-icon"
                style="
                  background:${
                    cat
                      ? cat.color+'22'
                      : '#8891A622'
                  };
                  color:${
                    cat
                      ? cat.color
                      : '#8891A6'
                  };
                "
              >
                ${cat ? cat.emoji : '💸'}
              </div>

              <div class="tx-body">

                <div class="tx-cat">
                  ${cat ? cat.name : 'Overig'}
                </div>

                <div class="tx-meta">

                  ${fmtShort(parseISO(e.date))}

                  ${
                    e.note
                      ? ' · '+escapeHtml(e.note)
                      : ''
                  }

                </div>

              </div>

              <div class="tx-amt num">
                ${euro(e.amount)}
              </div>

              <button
                class="tx-del"
                data-del="${e.id}"
              >
                ✕
              </button>

            </div>

          `;

        }).join('')
    }

  `;
}

/* =====================================================
   WEKEN
===================================================== */

function renderWeken(m){

function renderGeschiedenis(m){

  let expenses;

  if(ui.historyPeriod === 'cycle'){

    expenses =
      DATA.expenses.filter(e=>{

        const d =
          parseISO(e.date);

        return (
          d >= m.cycleStart &&
          d <= m.cycleEnd
        );

      });

  }else{

    expenses = [...DATA.expenses];

  }

  const total =
    expenses.reduce(
      (s,e)=>
        s + Number(e.amount || 0),
      0
    );

  const totals =
    DATA.categories.map(c=>{

      const spent =
        expenses
          .filter(
            e=>e.catId === c.id
          )
          .reduce(
            (s,e)=>
              s + Number(e.amount || 0),
            0
          );

      return {
        ...c,
        spent
      };

    });

  const other =
    expenses
      .filter(e=>!e.catId)
      .reduce(
        (s,e)=>
          s + Number(e.amount || 0),
        0
      );

  if(other > 0){

    totals.push({
      id:'other',
      name:'Overig',
      emoji:'💸',
      color:'#8891A6',
      spent:other
    });

  }

  totals.sort(
    (a,b)=>
      b.spent-a.spent
  );

  const max =
    Math.max(
      1,
      ...totals.map(
        c=>c.spent
      )
    );

  const sorted =
    [...expenses].sort(
      (a,b)=>
        b.date.localeCompare(a.date)
        ||
        b.id-a.id
    );

  return `

    <div class="history-summary">

      <div class="history-summary-title">
        ${
          ui.historyPeriod === 'cycle'
            ? 'Deze budgetcyclus'
            : 'Alle opgeslagen uitgaven'
        }
      </div>

      <div
        class="history-summary-total num"
      >
        ${euro(total)}
      </div>

      <div class="history-summary-sub">
        ${expenses.length}
        ${
          expenses.length === 1
            ? 'uitgave'
            : 'uitgaven'
        }
      </div>

    </div>

    <div class="section-title">
      Waar geef je het meeste aan uit?
    </div>

    ${
      totals.length === 0

        ?

        `
          <div class="empty">
            Nog geen uitgaven om te analyseren.
          </div>
        `

        :

        totals.map((c,i)=>{

          const percentage =
            total > 0
              ? (c.spent/total)*100
              : 0;

          return `

            <div class="history-rank">

              <div class="rank-number">
                ${i+1}
              </div>

              <div class="rank-info">

                <div class="rank-name">

                  <span
                    style="
                      color:${c.color};
                      margin-right:5px
                    "
                  >
                    ${c.emoji}
                  </span>

                  ${c.name}

                </div>

                <div class="rank-bar">

                  <div
                    class="bar-fill"
                    style="
                      width:${(c.spent/max)*100}%;
                      background:${c.color}
                    "
                  ></div>

                </div>

              </div>

              <div>

                <div
                  class="rank-amount num"
                >
                  ${euro(c.spent)}
                </div>

                <div class="rank-percent">
                  ${percentage.toFixed(0)}%
                </div>

              </div>

            </div>

          `;

        }).join('')
    }

    <div class="section-title">
      Alle uitgaven
    </div>

    <div class="history-filter">

      <button
        class="${ui.historyPeriod === 'cycle' ? 'active' : ''}"
        data-history="cycle"
      >
        Deze cyclus
      </button>

      <button
        class="${ui.historyPeriod === 'all' ? 'active' : ''}"
        data-history="all"
      >
        Alles
      </button>

    </div>

    ${
      sorted.length === 0

        ?

        `
          <div class="empty">
            Geen uitgaven gevonden.
          </div>
        `

        :

        sorted.map(e=>{

          const cat =
            DATA.categories.find(
              c=>c.id === e.catId
            );

          return `

            <div class="tx-item">

              <div
                class="tx-icon"
                style="
                  background:${
                    cat
                      ? cat.color+'22'
                      : '#8891A622'
                  };
                  color:${
                    cat
                      ? cat.color
                      : '#8891A6'
                  };
                "
              >
                ${cat ? cat.emoji : '💸'}
              </div>

              <div class="tx-body">

                <div class="tx-cat">
                  ${cat ? cat.name : 'Overig'}
                </div>

                <div class="tx-meta">
                  ${fmtLong(parseISO(e.date))}
                  ${
                    e.note
                      ? ' · '+escapeHtml(e.note)
                      : ''
                  }
                </div>

              </div>

              <div class="tx-amt num">
                ${euro(e.amount)}
              </div>

              <button
                class="tx-del"
                data-del="${e.id}"
              >
                ✕
              </button>

            </div>

          `;

        }).join('')
    }

  `;
}

  return transactions.map(t=>`

    <div

          color:var(--mint);

      </div>

}

      </div>

      <div class="month-total">

        vrij budget

        <span class="amt num">
          ${euro(m.freeBudget)}
        </span>

      </div>

    </header>

    <main>

      <section
        class="
          tab
          ${ui.tab === 'vandaag' ? 'active' : ''}
        "
      >
        ${renderVandaag(m)}
      </section>

      <section
        class="
          tab
          ${ui.tab === 'weken' ? 'active' : ''}
        "
      >
        ${renderWeken(m)}
      </section>

      <section
        class="
          tab
          ${ui.tab === 'categorieen' ? 'active' : ''}
        "
      >
        ${renderCategorieen(m)}
      </section>

      <section
        class="
          tab
          ${ui.tab === 'geschiedenis' ? 'active' : ''}
        "
      >
        ${renderGeschiedenis(m)}
      </section>

      <section
        class="
          tab
          ${ui.tab === 'spaardoelen' ? 'active' : ''}
      "
      >
        ${renderSpaardoelen()}
      </section>

      <section
        class="
          tab
          ${ui.tab === 'instellingen' ? 'active' : ''}
        "
      >
        ${renderInstellingen(m)}
      </section>

    </main>

    <button
      class="fab"
      id="fabAdd"
      aria-label="Uitgave toevoegen"
    >
      +
    </button>

    <nav class="tabbar">

      ${tabBtn(
        'vandaag',
        'Vandaag',
        iconHome()
      )}

      ${tabBtn(
        'weken',
        'Weken',
        iconCalendar()
      )}

      ${tabBtn(
        'categorieen',
        'Categorieën',
        iconPie()
      )}

      ${tabBtn(
        'geschiedenis',
        'Geschiedenis',
        iconHistory()
      )}

      ${tabBtn(
        'spaardoelen',
        'Sparen',
        iconSavings()
      )}

      ${tabBtn(
        'instellingen',
        'Instellingen',
        iconGear()
      )}

    </nav>

  `;

  attachEvents(m);
}

/* =====================================================
   EVENTS
===================================================== */

function attachEvents(m){

  /* TABS */

  document
    .querySelectorAll('.tab-btn')
    .forEach(btn=>{

      btn.onclick = ()=>{

        if(
          document.activeElement &&
          document.activeElement.blur
        ){
          document.activeElement.blur();
        }

        ui.tab =
          btn.dataset.tab;

        render();

      };

    });

  /* FAB */

  const fab =
    document.getElementById(
      'fabAdd'
    );

  if(fab){
    fab.onclick =
      openAddSheet;
  }

  /* UITGAVEN VERWIJDEREN */

  document
    .querySelectorAll('[data-del]')
    .forEach(btn=>{

      btn.onclick = e=>{

        e.stopPropagation();

        const id =
          Number(btn.dataset.del);

        DATA.expenses =
          DATA.expenses.filter(
            x=>x.id !== id
          );

        saveData();
        render();

      };

    });

  /* WEKEN */

  document
    .querySelectorAll('.week-top')
    .forEach(top=>{

      top.onclick = ()=>{

        const card =
          top.closest('.week-card');

        const idx =
          Number(
            card.dataset.week
          );

        ui.openWeek =
          ui.openWeek === idx
            ? null
            : idx;

        render();

      };

    });

  /* HISTORY */

  document
    .querySelectorAll('[data-history]')
    .forEach(btn=>{

      btn.onclick = ()=>{

        ui.historyPeriod =
          btn.dataset.history;

        render();

      };

    });

  /* SETTINGS */

  document
    .querySelectorAll('[data-setting]')
    .forEach(inp=>{

      const commit = ()=>{

        const key =
          inp.dataset.setting;

        const val =
          inp.type === 'date'
            ? inp.value
            : Number(inp.value);

        if(
          inp.type === 'date' &&
          !val
        ){
          return;
        }

        if(
          DATA.settings[key] === val
        ){
          return;
        }

        DATA.settings[key] =
          val;

        saveData();
        render();

      };

      inp.onchange =
        commit;

      if(inp.type === 'date'){
        inp.oninput =
          commit;
      }

    });

  /* CATEGORY */

  document
    .querySelectorAll('[data-cat-pct]')
    .forEach(inp=>{

      inp.onchange = ()=>{

        const idx =
          Number(
            inp.dataset.catPct
          );

        DATA.categories[idx].pct =
          Number(inp.value);

        saveData();
        render();

      };

    });

  /* RESET UITGAVEN */

  const resetBtn =
    document.getElementById(
      'resetBtn'
    );

  if(resetBtn){

    resetBtn.onclick = ()=>{

      if(
        confirm(
          'Alle uitgaven wissen? Dit kan niet ongedaan worden gemaakt.'
        )
      ){

        DATA.expenses = [];

        saveData();
        render();

      }

    };

  }

  /* NIEUW SPAARDOEL */

  const addGoalBtn =
    document.getElementById(
      'addGoalBtn'
    );

  if(addGoalBtn){

    addGoalBtn.onclick =
      openGoalSheet;

  }

  /* GELD TOEVOEGEN AAN DOEL */

  document
    .querySelectorAll('[data-add-goal]')
    .forEach(btn=>{

      btn.onclick = ()=>{

        ui.selectedGoalId =
          Number(
            btn.dataset.addGoal
          );

        openSavingSheet();

      };

    });

  /* DOEL AANPASSEN */

  document
    .querySelectorAll('[data-edit-goal]')
    .forEach(btn=>{

      btn.onclick = ()=>{

        editGoal(
          Number(
            btn.dataset.editGoal
          )
        );

      };

    });

  /* DOEL VERWIJDEREN */

  document
    .querySelectorAll('[data-delete-goal]')
    .forEach(btn=>{

      btn.onclick = ()=>{

        deleteGoal(
          Number(
            btn.dataset.deleteGoal
          )
        );

      };

    });

  /* SPAARTRANSACTIE VERWIJDEREN */

  document
    .querySelectorAll('[data-delete-saving]')
    .forEach(btn=>{

      btn.onclick = ()=>{

        const id =
          Number(
            btn.dataset.deleteSaving
          );

        if(
          !confirm(
            'Deze spaartransactie verwijderen?'
          )
        ){
          return;
        }

        DATA.savingsTransactions =
          DATA.savingsTransactions.filter(
            t=>t.id !== id
          );

        recalculateGoalSaved();

        saveData();
        render();

      };

    });

}

/* =====================================================
   UITGAVE MODAL
===================================================== */

function openAddSheet(){

  ui.chosenCat =
    DATA.categories[0].id;

  const backdrop =
    document.getElementById(
      'addBackdrop'
    );

  const chipRow =
    document.getElementById(
      'catChipRow'
    );

  chipRow.innerHTML =

    DATA.categories
      .map(c=>`

        <div
          class="
            chip
            ${
              c.id === ui.chosenCat
                ? 'active'
                : ''
            }
          "
          data-cat="${c.id}"
        >
          ${c.emoji}
          ${c.name}
        </div>

      `)
      .join('')

    +

    `
      <div
        class="chip"
        data-cat="__other__"
      >
        💸 Overig
      </div>
    `;

  chipRow
    .querySelectorAll('.chip')
    .forEach(chip=>{

      chip.onclick = ()=>{

        chipRow
          .querySelectorAll('.chip')
          .forEach(
            c=>
              c.classList.remove('active')
          );

        chip.classList.add('active');

        ui.chosenCat =
          chip.dataset.cat;

      };

    });

  document.getElementById(
    'amountInput'
  ).value = '';

  document.getElementById(
    'noteInput'
  ).value = '';

  document.getElementById(
    'dateInput'
  ).value =
    isoDate(todayDate());

  backdrop.classList.add('show');

  setTimeout(
    ()=>{
      document.getElementById(
        'amountInput'
      ).focus();
    },
    300
  );

  document.getElementById(
    'cancelExpenseBtn'
  ).onclick =
    closeAddSheet;

  backdrop.onclick = e=>{

    if(e.target === backdrop){
      closeAddSheet();
    }

  };

  document.getElementById(
    'saveExpenseBtn'
  ).onclick =
    submitExpense;

}

function closeAddSheet(){

  document
    .getElementById('addBackdrop')
    .classList.remove('show');

}

function submitExpense(){

  const raw =
    document.getElementById(
      'amountInput'
    )
    .value
    .replace(',','.');

  const amount =
    parseFloat(raw);

  if(
    !amount ||
    amount <= 0
  ){

    document.getElementById(
      'amountInput'
    ).focus();

    return;

  }

  const date =
    document.getElementById(
      'dateInput'
    ).value
    ||
    isoDate(todayDate());

  const note =
    document.getElementById(
      'noteInput'
    )
    .value
    .trim();

  const catId =
    ui.chosenCat === '__other__'
      ? null
      : ui.chosenCat;

  DATA.expenses.push({

    id:Date.now(),
    amount,
    date,
    note,
    catId

  });

  closeAddSheet();

  saveData();
  render();

}

/* =====================================================
   NIEUW SPAARDOEL
===================================================== */

function openGoalSheet(){

  document.getElementById(
    'goalNameInput'
  ).value = '';

  document.getElementById(
    'goalEmojiInput'
  ).value = '💰';

  document.getElementById(
    'goalTargetInput'
  ).value = '';

  const backdrop =
    document.getElementById(
      'goalBackdrop'
    );

  backdrop.classList.add('show');

  setTimeout(
    ()=>{
      document.getElementById(
        'goalNameInput'
      ).focus();
    },
    300
  );

  document.getElementById(
    'cancelGoalBtn'
  ).onclick =
    closeGoalSheet;

  backdrop.onclick = e=>{

    if(e.target === backdrop){
      closeGoalSheet();
    }

  };

  document.getElementById(
    'saveGoalBtn'
  ).onclick =
    submitGoal;

}

function closeGoalSheet(){

  document
    .getElementById('goalBackdrop')
    .classList.remove('show');

}

function submitGoal(){

  const name =
    document.getElementById(
      'goalNameInput'
    )
    .value
    .trim();

  const emoji =
    document.getElementById(
      'goalEmojiInput'
    )
    .value
    .trim()
    || '💰';

  const target =
    parseFloat(
      document.getElementById(
        'goalTargetInput'
      ).value
    );

  if(!name){

    alert(
      'Vul een naam voor je spaardoel in.'
    );

    return;
  }

  if(!target || target <= 0){

    alert(
      'Vul een geldig doelbedrag in.'
    );

    return;
  }

  DATA.savingsGoals.push({

    id:Date.now(),

    name,

    emoji,

    target,

    saved:0

  });

  closeGoalSheet();

  saveData();
  render();

}

/* =====================================================
   SPAARDOEL AANPASSEN
===================================================== */

function editGoal(id){

  const goal =
    DATA.savingsGoals.find(
      g =>
        Number(g.id) ===
        Number(id)
    );

  if(!goal){
    return;
  }

  const newName =
    prompt(
      'Naam van spaardoel:',
      goal.name
    );

  if(newName === null){
    return;
  }

  const newTarget =
    prompt(
      'Nieuw doelbedrag:',
      goal.target
    );

  if(newTarget === null){
    return;
  }

  const target =
    parseFloat(
      newTarget.replace(',','.')
    );

  if(
    !target ||
    target <= 0
  ){

    alert(
      'Vul een geldig doelbedrag in.'
    );

    return;
  }

  goal.name =
    newName.trim() || goal.name;

  goal.target =
    target;

  saveData();
  render();

}

/* =====================================================
   SPAARDOEL VERWIJDEREN
===================================================== */

function deleteGoal(id){

  const goal =
    DATA.savingsGoals.find(
      g =>
        Number(g.id) ===
        Number(id)
    );

  if(!goal){
    return;
  }

  if(
    !confirm(
      'Spaardoel "'+
      goal.name+
      '" verwijderen? De spaartransacties worden ook verwijderd.'
    )
  ){
    return;
  }

  DATA.savingsGoals =
    DATA.savingsGoals.filter(
      g =>
        Number(g.id) !==
        Number(id)
    );

  DATA.savingsTransactions =
    DATA.savingsTransactions.filter(
      t =>
        Number(t.goalId) !==
        Number(id)
    );

  saveData();
  render();

}

/* =====================================================
   GELD NAAR SPAARDOEL
===================================================== */

function openSavingSheet(){

  const goal =
    DATA.savingsGoals.find(
      g =>
        Number(g.id) ===
        Number(ui.selectedGoalId)
    );

  if(!goal){
    return;
  }

  document.getElementById(
    'savingGoalModalName'
  ).textContent =
    goal.emoji+' '+goal.name;

  document.getElementById(
    'savingAmountInput'
  ).value = '';

  document.getElementById(
    'savingNoteInput'
  ).value = '';

  document.getElementById(
    'savingDateInput'
  ).value =
    isoDate(todayDate());

  const backdrop =
    document.getElementById(
      'savingBackdrop'
    );

  backdrop.classList.add('show');

  setTimeout(
    ()=>{
      document.getElementById(
        'savingAmountInput'
      ).focus();
    },
    300
  );

  document.getElementById(
    'cancelSavingBtn'
  ).onclick =
    closeSavingSheet;

  backdrop.onclick = e=>{

    if(e.target === backdrop){
      closeSavingSheet();
    }

  };

  document.getElementById(
    'saveSavingBtn'
  ).onclick =
    submitSaving;

}

function closeSavingSheet(){

  document
    .getElementById('savingBackdrop')
    .classList.remove('show');

}

function submitSaving(){

  const goal =
    DATA.savingsGoals.find(
      g =>
        Number(g.id) ===
        Number(ui.selectedGoalId)
    );

  if(!goal){
    return;
  }

  const raw =
    document.getElementById(
      'savingAmountInput'
    )
    .value
    .replace(',','.');

  const amount =
    parseFloat(raw);

  if(
    !amount ||
    amount <= 0
  ){

    document.getElementById(
      'savingAmountInput'
    ).focus();

    return;
  }

  const date =
    document.getElementById(
      'savingDateInput'
    ).value
    ||
    isoDate(todayDate());

  const note =
    document.getElementById(
      'savingNoteInput'
    )
    .value
    .trim();

  DATA.savingsTransactions.push({

    id:Date.now(),

    goalId:goal.id,

    amount,

    date,

    note

  });

  recalculateGoalSaved();

  closeSavingSheet();

  saveData();
  render();

}

/* =====================================================
   INIT
===================================================== */

(async function init(){

  DATA =
    await loadData();

  recalculateGoalSaved();

  render();

})();

})();
