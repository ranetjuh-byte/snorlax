<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Budget Tracker</title>

<style>
:root{
  --bg:#080B12;
  --surface:#111722;
  --surface2:#171E2B;
  --surface3:#202A39;
  --line:#2A3547;

  --text:#F7F9FC;
  --muted:#8D98AA;
  --faint:#5F6B7D;

  --green:#38E3A7;
  --green2:#20B987;
  --blue:#5CA8FF;
  --purple:#9B7BFF;
  --orange:#FFB45C;
  --pink:#FF6FAE;
  --red:#FF646E;
  --cyan:#4ED8FF;
  --yellow:#FFD166;

  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  max-width:460px;
  min-height:100vh;
  padding-bottom:105px;

  background:
    radial-gradient(100% 35% at 50% 0%,rgba(56,227,167,.12),transparent 70%),
    radial-gradient(80% 30% at 100% 20%,rgba(92,168,255,.08),transparent 70%),
    var(--bg);
}

/* ================= HEADER ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:30;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    calc(env(safe-area-inset-top) + 17px)
    20px
    14px;

  background:rgba(8,11,18,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.04em;
}

.cycle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.header-total{
  text-align:right;
}

.header-total small{
  display:block;
  color:var(--faint);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.header-total strong{
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:17px;
}

/* ================= MAIN ================= */

main{
  padding:6px 16px 20px;
}

.tab{
  display:none;
}

.tab.active{
  display:block;
  animation:fade .22s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* ================= HERO ================= */

.hero{
  position:relative;
  overflow:hidden;

  padding:22px 18px 18px;
  border:1px solid var(--line);
  border-radius:28px;

  background:
    linear-gradient(145deg,#172331,#101621);
  box-shadow:
    0 15px 45px rgba(0,0,0,.22);
}

.hero:before{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  top:-130px;
  right:-90px;

  background:rgba(56,227,167,.12);
  filter:blur(20px);
  border-radius:50%;
}

.hero-title{
  position:relative;
  z-index:1;

  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.week-main{
  position:relative;
  z-index:1;

  margin-top:5px;

  font-size:46px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.06em;
}

.week-main.green{
  color:var(--green);
}

.week-sub{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

/* daily budget */

.daily-card{
  position:relative;
  z-index:1;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:18px;
  padding:13px 14px;

  border:1px solid rgba(255,255,255,.06);
  border-radius:17px;

  background:rgba(255,255,255,.035);
}

.daily-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.daily-icon{
  width:34px;
  height:34px;
  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(92,168,255,.13);
  color:var(--blue);
  font-size:16px;
}

.daily-label{
  color:var(--muted);
  font-size:11px;
}

.daily-value{
  margin-top:2px;
  font-size:20px;
  font-weight:750;
}

.daily-right{
  text-align:right;
}

.daily-right small{
  display:block;
  color:var(--faint);
  font-size:10px;
}

.daily-right strong{
  color:var(--blue);
  font-size:13px;
}

/* progress */

.progress{
  height:7px;
  margin-top:15px;

  overflow:hidden;

  background:#0C111A;
  border-radius:20px;
}

.progress-fill{
  height:100%;
  border-radius:20px;

  transition:width .3s ease;
}

/* hero stats */

.hero-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;

  margin-top:12px;
}

.stat{
  padding:11px 12px;

  border:1px solid rgba(255,255,255,.05);
  border-radius:15px;

  background:rgba(255,255,255,.035);
}

.stat-label{
  color:var(--faint);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.07em;
}

.stat-value{
  margin-top:4px;
  font-size:16px;
  font-weight:700;
}

/* ================= TITLES ================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:25px 2px 10px;

  color:var(--muted);
  font-size:12px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.section-title button{
  border:0;
  background:none;
  color:var(--green);
  font-size:12px;
  font-weight:700;
}

/* ================= TRANSACTIONS ================= */

.transaction{
  display:flex;
  align-items:center;
  gap:11px;

  margin-bottom:8px;
  padding:12px;

  border:1px solid var(--line);
  border-radius:17px;

  background:var(--surface);
}

.tx-icon{
  width:40px;
  height:40px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  font-size:18px;
}

.tx-body{
  flex:1;
  min-width:0;
}

.tx-name{
  font-size:13px;
  font-weight:700;
}

.tx-meta{
  margin-top:3px;
  color:var(--faint);
  font-size:10.5px;
}

.tx-amount{
  font-size:14px;
  font-weight:750;
}

.delete{
  border:0;
  background:none;
  color:var(--faint);
  font-size:16px;
  padding:3px;
}

/* ================= SAVINGS ================= */

.savings-card{
  position:relative;

  padding:17px;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(145deg,#151D2A,#101620);

  margin-bottom:10px;
}

.savings-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}

.savings-name{
  font-size:15px;
  font-weight:750;
}

.savings-target{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.savings-percent{
  color:var(--green);
  font-size:14px;
  font-weight:800;
}

.savings-amounts{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin-top:15px;
}

.saved{
  font-size:22px;
  font-weight:800;
}

.target{
  color:var(--muted);
  font-size:11px;
}

.savings-bar{
  height:9px;
  margin-top:12px;

  background:#0A0F17;
  border-radius:20px;
  overflow:hidden;
}

.savings-fill{
  height:100%;

  background:
    linear-gradient(90deg,var(--green),var(--cyan));

  border-radius:20px;
}

.savings-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.small-btn{
  flex:1;

  border:1px solid var(--line);
  border-radius:11px;

  padding:9px;

  background:var(--surface3);
  color:var(--text);

  font-size:11px;
  font-weight:700;
}

.small-btn.green{
  background:rgba(56,227,167,.1);
  color:var(--green);
  border-color:rgba(56,227,167,.25);
}

.small-btn.red{
  color:var(--red);
}

/* ================= WEEKS ================= */

.week-card{
  margin-bottom:9px;
  padding:16px;

  border:1px solid var(--line);
  border-radius:19px;

  background:var(--surface);
}

.week-card.current{
  border-color:rgba(56,227,167,.45);
  box-shadow:0 0 0 1px rgba(56,227,167,.1) inset;
}

.week-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.week-name{
  font-size:14px;
  font-weight:750;
}

.week-date{
  margin-top:3px;
  color:var(--faint);
  font-size:10.5px;
}

.week-money{
  text-align:right;
  font-size:18px;
  font-weight:800;
}

.week-money small{
  display:block;
  color:var(--faint);
  font-size:9px;
  text-transform:uppercase;
}

.week-info{
  display:flex;
  gap:15px;
  margin-top:12px;

  color:var(--muted);
  font-size:10.5px;
}

.week-info b{
  color:var(--text);
}

.rollover{
  margin-top:11px;
  padding:8px 10px;

  border-radius:10px;

  background:rgba(56,227,167,.07);
  color:var(--green);

  font-size:10.5px;
  font-weight:650;
}

/* ================= CATEGORY ================= */

.category-card{
  margin-bottom:9px;
  padding:15px;

  border:1px solid var(--line);
  border-radius:18px;

  background:var(--surface);
}

.category-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.category-name{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:13px;
  font-weight:700;
}

.category-dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.category-number{
  font-size:12px;
  color:var(--muted);
}

.category-number b{
  color:var(--text);
}

.category-bar{
  height:7px;
  margin-top:11px;

  background:#0B1018;
  border-radius:20px;
  overflow:hidden;
}

.category-fill{
  height:100%;
  border-radius:20px;
}

/* ================= HISTORY ================= */

.history-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.history-box{
  padding:15px;

  border:1px solid var(--line);
  border-radius:18px;

  background:var(--surface);
}

.history-box .label{
  color:var(--faint);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.07em;
}

.history-box .value{
  margin-top:5px;

  font-size:21px;
  font-weight:800;
}

.history-box.green .value{
  color:var(--green);
}

.history-box.orange .value{
  color:var(--orange);
}

.history-bar-item{
  margin-bottom:13px;
}

.history-bar-head{
  display:flex;
  justify-content:space-between;

  margin-bottom:5px;

  font-size:11px;
}

.history-bar-head span:first-child{
  color:var(--muted);
}

.history-bar-head span:last-child{
  font-weight:700;
}

.history-bar{
  height:8px;

  background:#0B1018;
  border-radius:20px;
  overflow:hidden;
}

.history-fill{
  height:100%;
  border-radius:20px;
}

/* ================= SETTINGS ================= */

.settings-group{
  margin-bottom:12px;
  padding:15px;

  border:1px solid var(--line);
  border-radius:19px;

  background:var(--surface);
}

.settings-title{
  margin-bottom:9px;

  color:var(--faint);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 0;

  border-bottom:1px solid rgba(255,255,255,.045);
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-row label{
  font-size:12.5px;
}

.setting-row input{
  width:110px;

  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:10px;

  background:var(--surface3);
  color:var(--text);

  text-align:right;
  font-size:13px;
}

.setting-row input:focus{
  outline:2px solid var(--green);
}

.danger{
  width:100%;

  padding:12px;

  border:1px solid rgba(255,100,110,.25);
  border-radius:12px;

  background:rgba(255,100,110,.1);
  color:var(--red);

  font-size:13px;
  font-weight:700;
}

/* ================= NAV ================= */

.nav{
  position:fixed;
  z-index:50;

  left:50%;
  bottom:0;

  width:100%;
  max-width:460px;

  transform:translateX(-50%);

  display:flex;

  padding:
    7px 7px
    calc(env(safe-area-inset-bottom) + 7px);

  background:rgba(14,19,28,.92);
  border-top:1px solid var(--line);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.nav button{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  border:0;
  background:none;

  color:var(--faint);

  padding:7px 0;

  font-size:9.5px;
  font-weight:700;
}

.nav button.active{
  color:var(--green);
}

.nav-icon{
  font-size:20px;
  line-height:20px;
}

/* ================= FAB ================= */

.fab{
  position:fixed;
  z-index:55;

  right:max(18px,calc((100vw - 460px)/2 + 18px));
  bottom:82px;

  width:56px;
  height:56px;

  border:0;
  border-radius:50%;

  background:
    linear-gradient(145deg,var(--green),var(--green2));

  color:#031810;

  font-size:29px;
  font-weight:500;

  box-shadow:
    0 8px 25px rgba(56,227,167,.3);
}

/* ================= MODAL ================= */

.backdrop{
  position:fixed;
  z-index:100;

  inset:0;

  display:flex;
  align-items:flex-end;

  background:rgba(0,0,0,.65);

  opacity:0;
  pointer-events:none;

  transition:opacity .2s;
}

.backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  width:100%;
  max-width:460px;
  margin:auto;

  padding:
    15px 20px
    calc(env(safe-area-inset-bottom) + 22px);

  border-radius:27px 27px 0 0;
  border:1px solid var(--line);
  border-bottom:0;

  background:#151D29;

  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);

  max-height:90vh;
  overflow:auto;
}

.backdrop.show .sheet{
  transform:translateY(0);
}

.handle{
  width:38px;
  height:4px;

  margin:0 auto 17px;

  background:#344052;
  border-radius:10px;
}

.sheet h2{
  margin:0 0 16px;

  font-size:18px;
}

.amount{
  display:flex;
  align-items:center;
  justify-content:center;

  margin:10px 0 22px;
}

.amount span{
  color:var(--muted);
  font-size:30px;
}

.amount input{
  width:190px;

  border:0;
  background:none;

  color:var(--text);

  text-align:center;

  font-size:42px;
  font-weight:800;
}

.amount input:focus{
  outline:0;
}

.input{
  width:100%;

  margin-bottom:10px;
  padding:13px 14px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--surface3);
  color:var(--text);

  font-size:14px;
}

.input:focus{
  outline:2px solid var(--green);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-bottom:13px;
}

.chip{
  padding:9px 12px;

  border:1px solid var(--line);
  border-radius:20px;

  background:var(--surface3);

  color:var(--muted);

  font-size:11px;
  font-weight:700;
}

.chip.active{
  background:var(--green);
  color:#031810;
  border-color:var(--green);
}

.primary{
  width:100%;

  padding:14px;

  border:0;
  border-radius:14px;

  background:var(--green);
  color:#031810;

  font-size:14px;
  font-weight:800;
}

.secondary{
  width:100%;

  margin-top:5px;
  padding:11px;

  border:0;
  background:none;

  color:var(--muted);

  font-size:13px;
}

/* ================= EMPTY ================= */

.empty{
  padding:25px 15px;

  border:1px dashed var(--line);
  border-radius:17px;

  background:var(--surface);

  color:var(--faint);

  text-align:center;
  font-size:12px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:200;

  left:50%;
  bottom:100px;

  transform:translate(-50%,20px);

  padding:10px 18px;

  border:1px solid var(--line);
  border-radius:30px;

  background:var(--surface3);
  color:var(--green);

  font-size:12px;
  font-weight:700;

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:360px){

  .week-main{
    font-size:40px;
  }

  .hero{
    padding:19px 15px 15px;
  }

  main{
    padding-left:12px;
    padding-right:12px;
  }
}
</style>
</head>

<body>

<div id="app">

  <header class="topbar">

    <div>
      <div class="brand">Budget</div>
      <div class="cycle" id="cycleText"></div>
    </div>

    <div class="header-total">
      <small>Vrij budget</small>
      <strong id="headerBudget">€0,00</strong>
    </div>

  </header>

  <main>

    <!-- ================= VANDAAG ================= -->

    <section class="tab active" id="tab-vandaag">

      <div id="todayContent"></div>

      <div class="section-title">
        <span>Laatste uitgaven</span>
      </div>

      <div id="recentExpenses"></div>

    </section>


    <!-- ================= WEKEN ================= -->

    <section class="tab" id="tab-weken">

      <div class="section-title">
        <span>Budgetweken</span>
      </div>

      <div id="weeksContent"></div>

    </section>


    <!-- ================= CATEGORIEËN ================= -->

    <section class="tab" id="tab-categorieen">

      <div class="section-title">
        <span>Deze cyclus</span>
      </div>

      <div id="categoriesContent"></div>

    </section>


    <!-- ================= SPAARDOELEN ================= -->

    <section class="tab" id="tab-sparen">

      <div class="section-title">
        <span>Mijn spaardoelen</span>

        <button onclick="openSavingsModal()">
          ＋ Nieuw doel
        </button>
      </div>

      <div id="savingsContent"></div>

    </section>


    <!-- ================= GESCHIEDENIS ================= -->

    <section class="tab" id="tab-geschiedenis">

      <div class="section-title">
        <span>Geschiedenis</span>
      </div>

      <div id="historyContent"></div>

    </section>


    <!-- ================= INSTELLINGEN ================= -->

    <section class="tab" id="tab-instellingen">

      <div id="settingsContent"></div>

    </section>

  </main>

</div>


<!-- FAB -->

<button class="fab" onclick="openExpenseModal()">+</button>


<!-- NAV -->

<nav class="nav">

  <button data-tab="vandaag" class="active">
    <span class="nav-icon">⌂</span>
    Vandaag
  </button>

  <button data-tab="weken">
    <span class="nav-icon">▦</span>
    Weken
  </button>

  <button data-tab="categorieen">
    <span class="nav-icon">◔</span>
    Categorieën
  </button>

  <button data-tab="sparen">
    <span class="nav-icon">◎</span>
    Sparen
  </button>

  <button data-tab="geschiedenis">
    <span class="nav-icon">↗</span>
    Geschiedenis
  </button>

  <button data-tab="instellingen">
    <span class="nav-icon">⚙</span>
    Instellingen
  </button>

</nav>


<!-- ================= UITGAVE MODAL ================= -->

<div class="backdrop" id="expenseModal">

  <div class="sheet">

    <div class="handle"></div>

    <h2>Nieuwe uitgave</h2>

    <div class="amount">
      <span>€</span>

      <input
        id="expenseAmount"
        type="text"
        inputmode="decimal"
        placeholder="0,00">
    </div>

    <div class="chips" id="categoryChips"></div>

    <input
      id="expenseNote"
      class="input"
      type="text"
      placeholder="Notitie (optioneel)">

    <input
      id="expenseDate"
      class="input"
      type="date">

    <button class="primary" onclick="saveExpense()">
      Uitgave toevoegen
    </button>

"use strict";


/* =========================================================
   DATA
========================================================= */

const DEFAULT_DATA = {

    salary1:3500,

    fixed2:550,

    invest:600,

    cycleStart:"",

    cycleLength:31

      name:"Boodschappen",
      pct:50,
      color:"#38E3A7",
      emoji:"🛒"
    },

    {
      id:"vervoer",
      name:"Vervoer",
      pct:30,
      color:"#5CA8FF",
      emoji:"⛽"
    },

    {
      id:"extra",
      name:"Leuke dingen",
      pct:20,
      color:"#FFB45C",
      emoji:"✨"
    }

  ],

  expenses:[],

  savings:[]

};


let DATA = null;

let selectedCategory = null;

let editingSavingId = null;

let selectedSavingId = null;


/* =========================================================
   DATE
========================================================= */

function isoDate(date){

  return date.getFullYear()
    + "-"
    + String(date.getMonth()+1).padStart(2,"0")
    + "-"
    + String(date.getDate()).padStart(2,"0");

}


function today(){

  const d = new Date();

  d.setHours(0,0,0,0);

  return d;

}


function parseDate(value){

  const parts = value.split("-").map(Number);

  return new Date(
    parts[0],
    parts[1]-1,
    parts[2]
  );

}


function addDays(date,days){

  const d = new Date(date);

  d.setDate(d.getDate()+days);

  return d;

}


function shortDate(date){

  return date.toLocaleDateString(
    "nl-NL",
    {
      day:"numeric",
      month:"short"
    }
  );

}


function longDate(date){

  return date.toLocaleDateString(
    "nl-NL",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


function defaultCycleStart(){

  const d = today();

  const start = new Date(
    d.getFullYear(),
    d.getMonth(),
    25
  );

  if(d.getDate()<25){

    start.setMonth(start.getMonth()-1);

  }

  return isoDate(start);

}


/* =========================================================
   EURO
========================================================= */

function euro(value){

  const number = Number(value)||0;

  return number.toLocaleString(
    "nl-NL",
    {
      style:"currency",
      currency:"EUR",
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem("budget-tracker-v4");

    if(saved){

      const parsed = JSON.parse(saved);

      return {

        ...DEFAULT_DATA,

        ...parsed,

        settings:{
          ...DEFAULT_DATA.settings,
          ...(parsed.settings||{})
        },

        categories:
          parsed.categories || DEFAULT_DATA.categories,

        expenses:
          parsed.expenses || [],

        savings:
          parsed.savings || []

      };

    }

  }catch(error){

    console.error(error);

  }

  const fresh =
    JSON.parse(JSON.stringify(DEFAULT_DATA));

  fresh.settings.cycleStart =
    defaultCycleStart();

  return fresh;

}


function saveData(){

  localStorage.setItem(
    "budget-tracker-v4",
    JSON.stringify(DATA)
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      ()=>el.classList.remove("show"),
      1600
    );

}


/* =========================================================
   MODEL
========================================================= */

function calculate(){

  const s = DATA.settings;

  const income =
    Number(s.salary1||0)
    +
    Number(s.salary2||0);

  const fixed =
    Number(s.fixed1||0)
    +
    Number(s.fixed2||0)
    +
    Number(s.invest||0);

  const freeBudget =
    income-fixed;

  const cycleLength =
    Math.max(1,Number(s.cycleLength)||31);

  const dailyBase =
    freeBudget/cycleLength;

  const start =
    parseDate(s.cycleStart);

  const weeks=[];

  let remainingDays =
    cycleLength;

  let cursor =
    new Date(start);

  let index=0;

  while(remainingDays>0){

    const days =
      Math.min(7,remainingDays);

    const end =
      addDays(cursor,days-1);

    const base =
      dailyBase*days;

    const expenses =
      DATA.expenses.filter(e=>{

        const d=parseDate(e.date);

        return d>=cursor && d<=end;

      });

    const spent =
      expenses.reduce(
        (sum,e)=>sum+Number(e.amount),
        0
      );

    weeks.push({

      index,
      start:new Date(cursor),
      end:new Date(end),
      days,
      base,
      spent,
      expenses

    });

    cursor =
      addDays(end,1);

    remainingDays -= days;

    index++;

  }


  let rollover=0;

  weeks.forEach(w=>{

    w.rolloverIn =
      rollover;

    w.available =
      w.base + rollover;

    w.remaining =
      w.available-w.spent;

    rollover =
      w.remaining;

  });


  const now =
    today();

  let currentIndex =
    weeks.findIndex(
      w=>now>=w.start && now<=w.end
    );

  if(currentIndex<0){

    currentIndex =
      now<weeks[0].start
        ? 0
        : weeks.length-1;

  }


  const current =
    weeks[currentIndex];


  const spentToday =
    DATA.expenses
      .filter(e=>parseDate(e.date).getTime()===now.getTime())
      .reduce(
        (sum,e)=>sum+Number(e.amount),
        0
      );


  const beforeToday =
    current.expenses
      .filter(e=>parseDate(e.date)<now)
      .reduce(
        (sum,e)=>sum+Number(e.amount),
        0
      );


  const daysLeft =
    Math.max(
      1,
      Math.round(
        (current.end-now)/86400000
      )+1
    );


  const remainingWeekBeforeToday =
    current.available-beforeToday;


  const dailyBudget =
    remainingWeekBeforeToday/daysLeft;


  const remainingToday =
    dailyBudget-spentToday;


  const categories =
    DATA.categories.map(c=>{

      const budget =
        current.base*
        (Number(c.pct)/100);

      const spent =
        current.expenses
          .filter(e=>e.catId===c.id)
          .reduce(
            (sum,e)=>sum+Number(e.amount),
            0
          );

      return {

        ...c,
        budget,
        spent,
        remaining:budget-spent

      };

    });


  return {

    income,
    fixed,
    freeBudget,
    dailyBase,
    weeks,
    currentIndex,
    current,
    dailyBudget,
    remainingToday,
    spentToday,
    categories,
    start

  };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const m =
    calculate();


  document.getElementById("cycleText").textContent =
    shortDate(m.start)
    +" – "
    +shortDate(m.weeks[m.weeks.length-1].end);


  document.getElementById("headerBudget").textContent =
    euro(m.freeBudget);


  renderToday(m);

  renderWeeks(m);

  renderCategories(m);

  renderSavings();

  renderHistory();

  renderSettings(m);

}

/* =========================================================

========================================================= */

function renderHistory(){

  const total =
    DATA.expenses.reduce(
      (sum,e)=>sum+Number(e.amount),
      0
    );


  const count =
    DATA.expenses.length;


  const average =
    count>0
      ? total/count
      : 0;


  const categoryTotals =
    DATA.categories.map(c=>{

      const amount =
        DATA.expenses
          .filter(e=>e.catId===c.id)
          .reduce(
            (sum,e)=>sum+Number(e.amount),
            0
          );

      return {
        ...c,
        amount
      };

    });


  const other =
    DATA.expenses
      .filter(e=>!e.catId)
      .reduce(
        (sum,e)=>sum+Number(e.amount),
        0
      );


  if(other>0){

    categoryTotals.push({

      id:"other",
      name:"Overig",
      emoji:"💸",
      color:"#8D98AA",
      amount:other

    });

  }


  const max =
    Math.max(
      1,
      ...categoryTotals.map(
        c=>c.amount
      )
    );


  const largest =
    [...categoryTotals]
      .sort(
        (a,b)=>b.amount-a.amount
      )[0];


  document.getElementById("historyContent").innerHTML = `

    <div class="history-summary">

      <div class="history-box green">

        <div class="label">
          Totaal uitgegeven
        </div>

        <div class="value">
          ${euro(total)}

          Gemiddeld per uitgave
        </div>

        <div class="value">
          ${euro(average)}
        </div>

      </div>


      <div class="history-box">

        <div class="label">
          Aantal uitgaven
        </div>

        <div class="value">
          ${count}
        </div>

      </div>


      <div class="history-box">

        <div class="label">
          Meeste geld naar
        </div>

        <div
          class="value"
          style="font-size:16px;"
        >
          ${
            largest && largest.amount>0
              ? largest.emoji+" "+escapeHtml(largest.name)
              : "Nog niets"
          }
        </div>

      </div>

    </div>


    <div class="section-title">
      Uitgaven per categorie
    </div>

    ${
      categoryTotals.length
        ? categoryTotals
            .sort((a,b)=>b.amount-a.amount)
            .map(c=>{

              const pct =
                total>0
                  ? c.amount/total*100
                  : 0;

              return `

                <div class="history-bar-item">

                  <div class="history-bar-head">

                    <span>
                      ${c.emoji}
                      ${escapeHtml(c.name)}
                    </span>

                    <span>
                      ${euro(c.amount)}
                      · ${Math.round(pct)}%
                    </span>

                  </div>


                  <div class="history-bar">

                    <div
                      class="history-fill"
                      style="
                        width:${(c.amount/max)*100}%;
                        background:${c.color};
                      "
                    ></div>

                  </div>

                </div>

              `;

            }).join("")
        : `
          <div class="empty">
            Nog geen geschiedenis.
          </div>
        `
    }


    <div class="section-title">
      Alle uitgaven
    </div>

    ${
      DATA.expenses.length
        ? [...DATA.expenses]
            .sort(
              (a,b)=>
                b.date.localeCompare(a.date)
                ||
                b.id-a.id
            )
            .map(renderTransaction)
            .join("")
        : `
          <div class="empty">
            Nog geen uitgaven.
          </div>
        `
    }

  `;

}

        <label>
          Salaris partner 2
        </label>

        <input
          type="number"
          step="0.01"
          value="${DATA.settings.salary2}"
          onchange="updateSetting('salary2',this.value)"
        >

      </div>


      <div class="setting-row">

        <label>
          Totaal inkomen
        </label>

        <strong>
          ${euro(m.income)}
        </strong>

      </div>

    </div>


    <div class="settings-group">

      <div class="settings-title">
        Vaste lasten & beleggen
      </div>


      <div class="setting-row">

        <label>
          Vaste lasten 1
        </label>

        <input
          type="number"
          step="0.01"
          value="${DATA.settings.fixed1}"
          onchange="updateSetting('fixed1',this.value)"
        >

      </div>


      <div class="setting-row">

        <label>
          Vaste lasten 2
        </label>

        <input
          type="number"
          step="0.01"
          value="${DATA.settings.fixed2}"
          onchange="updateSetting('fixed2',this.value)"
        >

      </div>


      <div class="setting-row">

        <label>
          Beleggen
        </label>

        <input
          type="number"
          step="0.01"
          value="${DATA.settings.invest}"
          onchange="updateSetting('invest',this.value)"
        >

      </div>


      <div class="setting-row">

        <label>
          Vrij te besteden
        </label>

        <strong
          style="color:var(--green)"
        >
          ${euro(m.freeBudget)}
        </strong>

      </div>

    </div>


    <div class="settings-group">

      <div class="settings-title">
        Budgetcyclus
      </div>


      <div class="setting-row">

        <label>
          Startdatum
        </label>

        <input
          type="date"
          value="${DATA.settings.cycleStart}"
          onchange="updateSetting('cycleStart',this.value)"
        >

      </div>


      <div class="setting-row">

        <label>
          Aantal dagen
        </label>

        <input
          type="number"
          value="${DATA.settings.cycleLength}"
          onchange="updateSetting('cycleLength',this.value)"
        >

      </div>

    </div>


    <div class="settings-group">

      <div class="settings-title">
        Categorieën
      </div>


      ${
        DATA.categories.map((c,i)=>`

          <div class="setting-row">

            <label>
              ${c.emoji}
              ${escapeHtml(c.name)}
            </label>

            <input
              type="number"
              value="${c.pct}"
              onchange="updateCategoryPct(${i},this.value)"
            >

          </div>

        `).join("")
      }


      <div
        style="
          margin-top:9px;
          color:${pctTotal===100
            ?"var(--green)"
            :"var(--red)"};
          font-size:11px;
          font-weight:700;
        "
      >
        Totaal: ${pctTotal}%
        ${
          pctTotal===100
            ?"✓"
            :" — moet 100% zijn"
        }
      </div>

    </div>


    <div class="settings-group">

      <div class="settings-title">
        Gegevens
      </div>

      <div
        style="
          color:var(--muted);
          font-size:11px;
          margin-bottom:12px;
        "
      >
        Alles wordt lokaal opgeslagen op dit apparaat.
      </div>


      <button
        class="danger"
        onclick="resetExpenses()"
      >
        Alle uitgaven wissen
      </button>

    </div>

  `;

}


/* =========================================================
   SETTINGS FUNCTIONS
========================================================= */

function updateSetting(key,value){

  if(key==="cycleStart"){

    if(!value) return;

    DATA.settings[key]=value;

  }else{

    DATA.settings[key]=Number(value)||0;

  }

  saveData();

  render();

  toast("Instelling opgeslagen");

}


function updateCategoryPct(index,value){

  DATA.categories[index].pct =
    Number(value)||0;

  saveData();

  render();

}


/* =========================================================
   EXPENSE MODAL
========================================================= */

function openExpenseModal(){

  selectedCategory =
    DATA.categories[0]?.id || null;


  document.getElementById("expenseAmount").value="";

  document.getElementById("expenseNote").value="";

  document.getElementById("expenseDate").value =
    isoDate(today());


  renderCategoryChips();


  document
    .getElementById("expenseModal")
    .classList.add("show");


  setTimeout(()=>{

    document
      .getElementById("expenseAmount")
      .focus();

  },250);

}


function renderCategoryChips(){

  const container =
    document.getElementById("categoryChips");


  container.innerHTML =

    DATA.categories.map(c=>`

      <button
        class="chip ${
          selectedCategory===c.id
            ?"active"
            :""
        }"
        onclick="chooseCategory('${c.id}')"
      >
        ${c.emoji} ${escapeHtml(c.name)}
      </button>

    `).join("")

    +

    `

      <button
        class="chip ${
          selectedCategory===null
            ?"active"
            :""
        }"
        onclick="chooseCategory(null)"
      >
        💸 Overig
      </button>

    `;

}


function chooseCategory(id){

  selectedCategory=id;

  renderCategoryChips();

}


function saveExpense(){

  const raw =
    document
      .getElementById("expenseAmount")
      .value
      .replace(",", ".");


  const amount =
    Number.parseFloat(raw);


  if(!amount || amount<=0){

    toast("Vul een bedrag in");

    return;

  }


  const date =
    document.getElementById("expenseDate").value
    || isoDate(today());


  const note =
    document
      .getElementById("expenseNote")
      .value
      .trim();


  DATA.expenses.push({

    id:Date.now(),

    amount,

    date,

    note,

    catId:selectedCategory

  });


  saveData();

  closeModals();

  render();

  toast("Uitgave toegevoegd");

}


function deleteExpense(id){

  if(!confirm("Deze uitgave verwijderen?")){

    return;

  }


  DATA.expenses =
    DATA.expenses.filter(
      e=>e.id!==id
    );


  saveData();

  render();

  toast("Uitgave verwijderd");

}


/* =========================================================
   SAVINGS MODAL
========================================================= */

function openSavingsModal(){

  editingSavingId=null;

  document.getElementById(
    "savingsModalTitle"
  ).textContent =
    "Nieuw spaardoel";


  document.getElementById(
    "savingName"
  ).value="";


  document.getElementById(
    "savingTarget"
  ).value="";


  document.getElementById(
    "savingCurrent"
  ).value="";


  document
    .getElementById("savingsModal")
    .classList.add("show");

}


function editSaving(id){

  const goal =
    DATA.savings.find(
      x=>x.id===id
    );


  if(!goal) return;


  editingSavingId=id;


  document.getElementById(
    "savingsModalTitle"
  ).textContent =
    "Spaardoel aanpassen";


  document.getElementById(
    "savingName"
  ).value =
    goal.name;


  document.getElementById(
    "savingTarget"
  ).value =
    goal.target;


  document.getElementById(
    "savingCurrent"
  ).value =
    goal.current;


  document
    .getElementById("savingsModal")
    .classList.add("show");

}


function saveSavingsGoal(){

  const name =
    document
      .getElementById("savingName")
      .value
      .trim();


  const target =
    Number(
      document.getElementById(
        "savingTarget"
      ).value
    );


  const current =
    Number(
      document.getElementById(
        "savingCurrent"
      ).value
    ) || 0;


  if(!name){

    toast("Geef je spaardoel een naam");

    return;

  }


  if(!target || target<=0){

    toast("Vul een geldig doelbedrag in");

    return;

  }


  if(editingSavingId){

    const goal =
      DATA.savings.find(
        x=>x.id===editingSavingId
      );


    if(goal){

      goal.name=name;

      goal.target=target;

      goal.current=Math.max(
        0,
        current
      );

    }

  }else{

    DATA.savings.push({

      id:Date.now(),

      name,

      target,

      current:Math.max(
        0,
        current
      )

    });

  }


  saveData();

  closeModals();

  render();

  toast("Spaardoel opgeslagen");

}


function openSavingAdd(id){

  selectedSavingId=id;

  document.getElementById(
    "savingAddAmount"
  ).value="";


  document
    .getElementById("savingAddModal")
    .classList.add("show");

}


function addSavingMoney(){

  const amount =
    Number(
      document
        .getElementById("savingAddAmount")
        .value
        .replace(",", ".")
    );


  if(!amount || amount<=0){

    toast("Vul een bedrag in");

    return;

  }


  const goal =
    DATA.savings.find(
      x=>x.id===selectedSavingId
    );


  if(!goal) return;


  goal.current =
    Number(goal.current||0)
    +
    amount;


  saveData();

  closeModals();

  render();

  toast("Bedrag toegevoegd");

}


function deleteSaving(id){

  if(!confirm(
    "Dit spaardoel verwijderen?"
  )){

    return;

  }


  DATA.savings =
    DATA.savings.filter(
      x=>x.id!==id
    );


  saveData();

  render();

  toast("Spaardoel verwijderd");

}


/* =========================================================
   MODALS
========================================================= */

function closeModals(){

  document
    .querySelectorAll(".backdrop")
    .forEach(el=>
      el.classList.remove("show")
    );

}


document
  .querySelectorAll(".backdrop")
  .forEach(backdrop=>{

    backdrop.addEventListener(
      "click",
      event=>{

        if(event.target===backdrop){

          closeModals();

        }

      }
    );

  });


/* =========================================================
   RESET
========================================================= */

function resetExpenses(){

  if(!confirm(
    "Alle uitgaven verwijderen? Dit kan niet ongedaan worden gemaakt."
  )){

    return;

  }


  DATA.expenses=[];

  saveData();

  render();

  toast("Uitgaven gewist");

}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(".nav button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const tab =
          button.dataset.tab;


        document
          .querySelectorAll(".nav button")
          .forEach(b=>
            b.classList.remove("active")
          );


        button.classList.add("active");


        document
          .querySelectorAll(".tab")
          .forEach(section=>
            section.classList.remove("active")
          );


        document
          .getElementById(
            "tab-"+tab
          )
          .classList.add("active");


        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  });


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      char=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      })[char]
    );

}


/* =========================================================
   INIT
========================================================= */

DATA=loadData();


if(!DATA.settings.cycleStart){

  DATA.settings.cycleStart =
    defaultCycleStart();

  saveData();

}


render();

</script>

</body>
</html>
